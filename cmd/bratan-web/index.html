<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRATAN GO</title>
<style>
html,body {
	margin:0;
	width:100%;
	height:100%;
	background:#111;
	color:#ddd;
	font-family:monospace;
}
body {
	display:flex;
	flex-direction:column;
}
header {
	padding:12px 16px;
	border-bottom:1px solid #333;
}
.title {
	font-size:20px;
	font-weight:bold;
}
.info {
	margin-top:6px;
	color:#888;
	font-size:13px;
}
main {
	flex:1;
	display:flex;
	flex-direction:column;
	min-height:0;
}
#output {
	flex:1;
	overflow:auto;
	padding:14px;
	white-space:pre-wrap;
	word-break:break-word;
	font-size:14px;
	line-height:1.45;
	background:#090909;
}
.controls {
	border-top:1px solid #333;
	padding:12px;
	display:flex;
	gap:10px;
	background:#151515;
}
textarea {
	flex:1;
	min-height:70px;
	resize:vertical;
	background:#0b0b0b;
	color:#eee;
	border:1px solid #444;
	padding:10px;
	font:14px monospace;
}
button {
	width:120px;
	border:1px solid #555;
	background:#222;
	color:#fff;
	cursor:pointer;
	font:bold 14px monospace;
}
button:hover {
	background:#333;
}
button:disabled {
	color:#666;
	cursor:not-allowed;
}
.status {
	padding:6px 12px;
	border-top:1px solid #333;
	color:#888;
	font-size:12px;
}
</style>
</head>
<body>

<header>
	<div class="title">BRATAN GO</div>
	<div class="info">
		model: {{.Model}} &nbsp; | &nbsp;
		project: {{.Project}} &nbsp; | &nbsp;
		max iterations: {{.MaxIterations}}
	</div>
</header>

<main>
	<div id="output"></div>

	<div class="controls">
		<textarea id="task" placeholder="Введите задачу BRATAN..."></textarea>
		<button id="run">ЗАПУСК</button>
	</div>

	<div class="status" id="status">готов</div>
</main>

<script>
const output = document.getElementById("output");
const task = document.getElementById("task");
const run = document.getElementById("run");
const status = document.getElementById("status");

function write(text) {
	output.textContent += text;
	output.scrollTop = output.scrollHeight;
}

run.addEventListener("click", async () => {
	const value = task.value.trim();

	if (!value) {
		status.textContent = "задача не указана";
		return;
	}

	run.disabled = true;
	status.textContent = "BRATAN работает...";
	output.textContent = "";

	try {
		const response = await fetch("/run", {
			method: "POST",
			headers: {
				"Content-Type": "application/json"
			},
			body: JSON.stringify({
				task: value
			})
		});

		if (!response.ok) {
			write(await response.text());
			status.textContent = "ошибка";
			return;
		}

		const reader = response.body.getReader();
		const decoder = new TextDecoder();

		while (true) {
			const {value, done} = await reader.read();

			if (done) {
				break;
			}

			write(decoder.decode(value, {stream:true}));
		}

		status.textContent = "готово";
	} catch (e) {
		write("\n[WEB ERROR] " + e + "\n");
		status.textContent = "ошибка";
	} finally {
		run.disabled = false;
	}
});

task.addEventListener("keydown", e => {
	if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
		run.click();
	}
});
</script>

</body>
</html>
